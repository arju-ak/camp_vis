<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Vision AI — Dashboard</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Socket.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.1/socket.io.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg: #0f111a;
            --bg-card: rgba(20, 24, 39, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f3f4f6;
            --text-dim: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
            --accent-purple: #8b5cf6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(15, 17, 26, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            color: transparent;
        }

        .header p {
            font-size: 12px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        .status-badges {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge.live {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .badge.sim {
            background: rgba(245, 158, 11, 0.1);
            color: var(--accent-amber);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .badge.live .badge-dot {
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 2s infinite;
        }

        .badge.sim .badge-dot {
            background: var(--accent-amber);
        }

        .timestamp {
            color: var(--text-dim);
            font-size: 14px;
            font-variant-numeric: tabular-nums;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }

            100% {
                opacity: 1;
            }
        }

        .container {
            padding: 24px 40px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* 3D Scene */
        .scene-container {
            width: 100%;
            height: 280px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        .scene-overlay {
            position: absolute;
            bottom: 20px;
            left: 24px;
            pointer-events: none;
        }

        .scene-overlay h2 {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .scene-overlay p {
            font-size: 12px;
            color: var(--text-dim);
        }

        /* Stats Row */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent);
        }

        .stat-title {
            font-size: 12px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-sub {
            font-size: 13px;
            color: var(--text-dim);
        }

        /* Panels Grid */
        .panels-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            align-items: start;
        }

        .panel {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Live Video */
        .video-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: #000;
            position: relative;
            margin-top: 16px;
        }

        .video-feed {
            width: 100%;
            aspect-ratio: 16/9;
            display: block;
            object-fit: cover;
        }

        .video-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            padding: 6px 12px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .video-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-red);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-red);
            animation: pulse 1.5s infinite;
        }

        .video-text {
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Event Lists */
        .event-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .event-list::-webkit-scrollbar {
            width: 4px;
        }

        .event-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .event-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .event-item.alert {
            background: rgba(239, 68, 68, 0.05);
            border-color: rgba(239, 68, 68, 0.2);
        }

        .event-main {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .event-title {
            font-size: 14px;
            font-weight: 500;
        }

        .event-meta {
            font-size: 12px;
            color: var(--text-dim);
        }

        .event-value {
            font-size: 14px;
            font-weight: 600;
        }

        .event-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .event-badge.high {
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
        }

        .event-badge.med {
            background: rgba(245, 158, 11, 0.2);
            color: var(--accent-amber);
        }

        .event-badge.ok {
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
        }

        /* Attention Gauge */
        .gauge-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }

        .gauge {
            position: relative;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: conic-gradient(var(--accent-purple) var(--fill), rgba(255, 255, 255, 0.05) 0);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gauge-inner {
            width: 140px;
            height: 140px;
            background: var(--bg-card);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .gauge-val {
            font-size: 32px;
            font-weight: 700;
        }

        .gauge-lbl {
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Scene3D = () => {
            const containerRef = useRef(null);

            useEffect(() => {
                if (!containerRef.current) return;

                const w = containerRef.current.clientWidth;
                const h = containerRef.current.clientHeight;

                const scene = new THREE.Scene();
                scene.fog = new THREE.FogExp2(0x0f111a, 0.03);

                const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
                camera.position.set(0, 15, 25);
                camera.lookAt(0, 0, 0);

                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setSize(w, h);
                renderer.setPixelRatio(window.devicePixelRatio);
                containerRef.current.appendChild(renderer.domElement);

                const gridHelper = new THREE.GridHelper(40, 40, 0x3b82f6, 0xffffff);
                gridHelper.material.opacity = 0.1;
                gridHelper.material.transparent = true;
                scene.add(gridHelper);

                const zones = new THREE.Group();
                const colors = [0x3b82f6, 0x10b981, 0xef4444, 0x8b5cf6, 0xf59e0b];

                for (let i = 0; i < 5; i++) {
                    const geometry = new THREE.BoxGeometry(2, Math.random() * 4 + 2, 2);
                    const material = new THREE.MeshBasicMaterial({
                        color: colors[i],
                        transparent: true,
                        opacity: 0.2,
                        wireframe: true
                    });
                    const cube = new THREE.Mesh(geometry, material);
                    cube.position.set(Math.random() * 15 - 7.5, cube.geometry.parameters.height / 2, Math.random() * 15 - 7.5);
                    zones.add(cube);
                }
                scene.add(zones);

                const animate = () => {
                    requestAnimationFrame(animate);
                    zones.rotation.y += 0.002;
                    renderer.render(scene, camera);
                };
                animate();

                const handleResize = () => {
                    if (!containerRef.current) return;
                    const width = containerRef.current.clientWidth;
                    const height = containerRef.current.clientHeight;
                    renderer.setSize(width, height);
                    camera.aspect = width / height;
                    camera.updateProjectionMatrix();
                };
                window.addEventListener('resize', handleResize);

                return () => {
                    window.removeEventListener('resize', handleResize);
                    if (containerRef.current && renderer.domElement) {
                        try {
                            containerRef.current.removeChild(renderer.domElement);
                        } catch (e) { }
                    }
                };
            }, []);

            return (
                <div className="scene-container" ref={containerRef}>
                    <div className="scene-overlay">
                        <h2>Campus Digital Twin</h2>
                        <p>Real-time 3D visualization of monitoring zones</p>
                    </div>
                </div>
            );
        };

        const getApiEndpoints = () => {
            const endpoints = [];
            if (window.CUSTOM_API_BASE) {
                endpoints.push(window.CUSTOM_API_BASE);
            }
            
            // Hugging Face Space Cloud Backend default
            endpoints.push('https://arju-ak-camp-vis.hf.space');

            // Try relative path first if served from Flask
            if (window.location.port === '5000' || window.location.port === '7860') endpoints.push('');

            // Try explicit host/port combinations
            const hosts = [window.location.hostname || 'localhost', '127.0.0.1', 'localhost'];
            for (const h of hosts) {
                endpoints.push(`http://${h}:5000`);
            }
            if (!endpoints.includes('')) endpoints.push('');
            return Array.from(new Set(endpoints));
        };

        const Dashboard = () => {
            const [stats, setStats] = useState(null);
            const [error, setError] = useState(null);
            const [clock, setClock] = useState(new Date().toLocaleTimeString());
            const [events, setEvents] = useState({
                attendance: [], attention: [], occupancy: [], intruder: [], fire: []
            });

            useEffect(() => {
                const t = setInterval(() => setClock(new Date().toLocaleTimeString()), 1000);
                return () => clearInterval(t);
            }, []);

            useEffect(() => {
                let activeEndpoint = '';
                const fetchStats = async () => {
                    const endpoints = getApiEndpoints();
                    let success = false;
                    for (const ep of endpoints) {
                        try {
                            const res = await fetch((ep ? ep : '') + '/api/stats');
                            if (res.ok) {
                                const data = await res.json();
                                setStats(data);
                                setError(null);
                                window.ACTIVE_API_BASE = ep;
                                success = true;
                                break;
                            }
                        } catch (e) {
                            // Try next endpoint
                        }
                    }
                    if (!success && !stats) {
                        setError('Waiting for backend server on http://localhost:5000...');
                    }
                };

                fetchStats();
                const pollTimer = setInterval(fetchStats, 2000);

                try {
                    if (window.io) {
                        const socketUrl = window.ACTIVE_API_BASE || 'http://localhost:5000';
                        const socket = window.io(socketUrl);
                        socket.on('vision_event', (e) => {
                            if (e.type === 'attendance') {
                                setEvents(prev => ({ ...prev, attendance: [e, ...prev.attendance].slice(0, 10) }));
                            } else if (e.type === 'intruder') {
                                setEvents(prev => ({ ...prev, intruder: [e, ...prev.intruder].slice(0, 10) }));
                            } else if (e.type === 'fire_smoke') {
                                setEvents(prev => ({ ...prev, fire: [e, ...prev.fire].slice(0, 10) }));
                            }
                            fetchStats();
                        });
                    }
                } catch(e) {
                    console.log('Socket initialization note:', e);
                }

                return () => clearInterval(pollTimer);
            }, []);

            const API_BASE = window.ACTIVE_API_BASE || (window.location.port === '5000' ? '' : 'http://localhost:5000');

            if (!stats) {
                return (
                    <div style={{ padding: 40, color: '#e4e4e7', fontFamily: 'sans-serif' }}>
                        <h3 style={{ marginBottom: 10, color: '#38bdf8' }}>Connecting to Campus Vision API...</h3>
                        <p style={{ color: '#a1a1aa', fontSize: 14 }}>{error || 'Establishing connection to http://localhost:5000...'}</p>
                    </div>
                );
            }

            return (
                <div>
                    <div className="header">
                        <div>
                            <h1>Campus Vision AI</h1>
                            <p>Intelligent Surveillance System</p>
                        </div>
                        <div className="status-badges">
                            <div className={`badge ${stats.mode === 'live' ? 'live' : 'sim'}`}>
                                <div className="badge-dot"></div>
                                {stats.mode === 'live' ? 'LIVE MODE' : 'SIMULATION'}
                            </div>
                            <div className="timestamp">{clock} — {new Date().toLocaleDateString()}</div>
                        </div>
                    </div>

                    <div className="container">
                        <Scene3D />

                        <div className="stats-grid">
                            <div className="stat-card" style={{ '--accent': 'var(--accent-blue)' }}>
                                <div className="stat-title">Attendance</div>
                                <div className="stat-value">{stats.attendance.present_today}</div>
                                <div className="stat-sub">{stats.attendance.attendance_rate}% of {stats.attendance.total_enrolled} enrolled</div>
                            </div>
                            <div className="stat-card" style={{ '--accent': 'var(--accent-purple)' }}>
                                <div className="stat-title">Attention</div>
                                <div className="stat-value">{stats.attention.attention_pct}%</div>
                                <div className="stat-sub">{stats.attention.attentive} attentive of {stats.attention.total_faces}</div>
                            </div>
                            <div className="stat-card" style={{ '--accent': 'var(--accent-green)' }}>
                                <div className="stat-title">Occupancy</div>
                                <div className="stat-value">{stats.occupancy.count}</div>
                                <div className="stat-sub">{stats.occupancy.percentage}% of {stats.occupancy.capacity} capacity</div>
                            </div>
                            <div className="stat-card" style={{ '--accent': 'var(--accent-amber)' }}>
                                <div className="stat-title">Intruder Alerts</div>
                                <div className="stat-value">{stats.intruders.today}</div>
                                <div className="stat-sub">Alerts today</div>
                            </div>
                            <div className="stat-card" style={{ '--accent': 'var(--accent-red)' }}>
                                <div className="stat-title">Fire/Smoke</div>
                                <div className="stat-value">{stats.fire.today}</div>
                                <div className="stat-sub">Detections today</div>
                            </div>
                        </div>

                        <div className="panels-grid">
                            <div className="panel">
                                <div className="panel-header">
                                    <div className="panel-title">👥 Face Recognition</div>
                                </div>
                                <div className="event-list" style={{ maxHeight: 140 }}>
                                    {events.attendance.length === 0 ?
                                        <div style={{ color: 'var(--text-dim)', fontSize: 13 }}>No recent recognitions...</div> :
                                        events.attendance.map((ev, i) => (
                                            <div key={i} className="event-item">
                                                <div className="event-main">
                                                    <span className="event-title">{ev.student_name}</span>
                                                    <span className="event-meta">{ev.student_id}</span>
                                                </div>
                                                <span className="event-badge ok">{(ev.confidence * 100).toFixed(0)}% Match</span>
                                            </div>
                                        ))
                                    }
                                </div>
                                <div className="video-container">
                                    <img src={API_BASE + '/api/video_feed'} alt="Live Feed" className="video-feed" onError={(e) => e.target.style.display = 'none'} />
                                    <div className="video-overlay">
                                        <div className="video-dot"></div>
                                        <span className="video-text">Live Camera Feed</span>
                                    </div>
                                </div>
                            </div>

                            <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
                                <div className="panel">
                                    <div className="panel-header">
                                        <div className="panel-title">🧠 Classroom Attention</div>
                                    </div>
                                    <div className="gauge-wrapper">
                                        <div className="gauge" style={{ '--fill': `${stats.attention.attention_pct}%` }}>
                                            <div className="gauge-inner">
                                                <div className="gauge-val">{stats.attention.attention_pct}%</div>
                                                <div className="gauge-lbl">Attentive</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="panel" style={{ borderColor: 'rgba(239, 68, 68, 0.3)' }}>
                                    <div className="panel-header">
                                        <div className="panel-title" style={{ color: 'var(--accent-red)' }}>⚠️ Security Alerts</div>
                                    </div>
                                    <div className="event-list" style={{ maxHeight: 180 }}>
                                        {[...events.intruder, ...events.fire].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).length === 0 ?
                                            <div style={{ color: 'var(--text-dim)', fontSize: 13 }}>No active security alerts.</div> :
                                            [...events.intruder, ...events.fire].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).map((ev, i) => (
                                                <div key={i} className="event-item alert">
                                                    <div className="event-main">
                                                        <span className="event-title">{ev.type === 'intruder' ? 'Unauthorized Person' : `${ev.event_type.toUpperCase()} DETECTED`}</span>
                                                        <span className="event-meta">{new Date(ev.timestamp).toLocaleTimeString()}</span>
                                                    </div>
                                                    <span className="event-badge high">ALERT</span>
                                                </div>
                                            ))
                                        }
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>

</html>
